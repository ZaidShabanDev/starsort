[project]
name = "starsort"
version = "0.1.0"
description = "Organize your GitHub starred repos into an awesome-list README using a Strands agent."
readme = "README.md"
license = "MIT"
authors = [{ name = "Zaid Shaban" }]
keywords = ["github", "stars", "awesome-list", "strands-agents", "bedrock", "cli"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "strands-agents>=1.64.0",
    "typer>=0.12",
]

[project.scripts]
starsort = "starsort.cli:app"

[project.urls]
Homepage = "https://github.com/ZaidShabanDev/starsort"
Issues = "https://github.com/ZaidShabanDev/starsort/issues"

[project.optional-dependencies]
anthropic = [
    "strands-agents[anthropic]>=1.64.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
