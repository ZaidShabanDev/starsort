name: CI

# Checks only: no AWS access. deploy.yml calls this before every deploy.
on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0 # no short v10 tag: setup-uv only publishes full versions
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies (fails if uv.lock is out of date)
        run: uv sync --locked

      - name: Run pytest
        run: uv run pytest

  frontend:
    name: Angular tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.x"

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Validate infra
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

      - name: Validate infra/web
        run: |
          terraform -chdir=infra/web init -backend=false -input=false
          terraform -chdir=infra/web validate
