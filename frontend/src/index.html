<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Starsort</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sort your GitHub stars into categories with AI and get a ready-to-share awesome list.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <!-- Apply the saved theme before the page paints, so dark mode doesn't flash white. Same key as src/app/theme.ts. -->
  <script>
    try {
      var theme = localStorage.getItem('starsort-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
